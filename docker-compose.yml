services:
  postgres:
    image: postgres:17-alpine
    container_name: sdj_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sdj_assistant
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sdj_network
    restart: unless-stopped

  postgres_test:
    image: postgres:17-alpine
    container_name: sdj_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sdj_assistant_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sdj_network
    restart: unless-stopped
    profiles:
      - test

  redis:
    image: redis:7-alpine
    container_name: sdj_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sdj_network
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  postgres_data:
    name: sdj_postgres_data
  postgres_test_data:
    name: sdj_postgres_test_data
  redis_data:
    name: sdj_redis_data

networks:
  sdj_network:
    name: sdj_network
    driver: bridge
